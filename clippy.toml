# Clippy thresholds. The lint levels themselves live in `Cargo.toml` under
# `[lints.clippy]`; this file only tunes the values those lints compare against.

cognitive-complexity-threshold = 25
too-many-lines-threshold = 100
too-many-arguments-threshold = 7
type-complexity-threshold = 250

# Tests assert by panicking. The restriction lints stay denied in `src/`.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
