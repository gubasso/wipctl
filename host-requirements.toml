# The host tools that the justfile, the git hooks, and scripts/ of wipctl call.
# The flake devShell, Cargo.toml, and .pre-commit-config.yaml own every other
# tool, so none of those appear here. The base tools (bash, sh, grep, and the
# coreutils) are not listed. `exobrain host-check` reads this file: the
# justfile checks the global tools once per run, and a recipe that alone uses a
# tool checks it as its first line. The convention and the checker belong to
# exobrain-tech.
schema = 1

# Global. Every recipe runs through `nix develop` (flakes enabled), and the
# hooks and scripts/check-schemas call git.
[tools.nix]

[tools.git]

# Path-scoped: the git hooks, and the lint and lint-push recipes. prek enforces
# its own version through minimum_prek_version in .pre-commit-config.yaml, so
# this file names no floor.
[tools.prek]
version = "*"
