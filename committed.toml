# Commit-message length and punctuation (crate-ci/committed).
#
# The Conventional Commits shape — the type, the scope, and the scope
# vocabulary — is owned by the `conventional-pre-commit` hook inside the
# release-kit block of `.pre-commit-config.yaml`, which reads the scope list
# recorded in `.release-kit/manifest.json`. That list and the pull-request
# title check are rendered from one source, so the local hook and the forge
# gate can never disagree. `style = "none"` here is what keeps a second
# authority off that job.
#
# What is left is what no other hook checks: the line width and the trailing
# period.
#
# Length model (committed-specific): `line_length` caps EVERY line, incl. the
# subject line -> this is the real subject ceiling. `subject_length` caps the
# subject line as a whole under `style = "none"`.
# Note: committed grants a one-trailing-word grace, so a subject a few chars over
# 72 may still pass; clearly-over subjects (and body lines) are rejected. Aim for
# <=72. (`hard_line_length` would be an absolute no-grace cap, but it also forbids
# long unbreakable tokens like URLs in the body, so we leave it off.)
style = "none"
subject_length = 72
line_length = 72              # full subject line AND body lines (classic 50/72)
subject_capitalized = false   # CC convention: lowercase description after the colon
subject_not_punctuated = true # no trailing period
imperative_subject = false    # heuristic mood check off -> avoids false positives
