# Release automation for crates.io.
#
# The filename is load-bearing: crates.io Trusted Publishing matches the
# registered publisher on the workflow filename, so this file must stay
# `.github/workflows/release-plz.yml` and stay separate from `ci.yml`.
#
# Publishing is OIDC (Trusted Publishing) — `id-token: write`, no long-lived
# `CARGO_REGISTRY_TOKEN`. The first publish of the crate is manual; trusted
# publishing can only be registered on a crate that already exists.
#
# The GitHub App token is load-bearing too: with the default `GITHUB_TOKEN`,
# the tag release-plz pushes does not retrigger other workflows, so the
# cargo-dist `release.yml` never builds binaries.
name: release-plz

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: release-plz/action@v0.5
        with:
          command: release-plz
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
