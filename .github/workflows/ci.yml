# CI for wipctl.
#
# Every job enters the project's pinned Nix devshell once (`nix develop --command
# just ...`) and then calls a justfile recipe. The justfile prefixes each recipe
# with `nix develop --command` itself, so CI passes `dev=''` to stop the devshell
# being entered a second time per recipe.
#
# The gates themselves live in `.pre-commit-config.yaml` and the `justfile`;
# nothing here re-implements a check. CI runs the commit stage, the push stage,
# and one check that only CI can run, so a push that passed its hooks passes CI
# (quality-gates:the-local-stages-hold-every-ci-check). That check is
# `dist-build`, which builds every release target on its own runner, and
# README.md lists it with its reason. Adding a gate means adding a hook, not
# editing this file.
#
# Hardening upgrade: pin each action to a full commit SHA and let Dependabot
# raise the bumps. Left on major tags because unattended SHA pins rot.
name: ci

# `release/**` is here for the day an older line is cut. A line's own CI must
# run again on the line, because a cherry-pick is not the commit the trunk
# tested, and the release request opened against the line requires the same
# passing check the trunk's requires.
on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop, 'release/**']

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# One in-flight run per ref; a new push supersedes the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Commit-stage gate: formatting, lints, editorconfig, spelling, markdown,
  # secrets — whatever `.pre-commit-config.yaml` runs at the pre-commit stage.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Lint
        # CI commits nothing and its checkout is detached on the main
        # worktree, so the two commit-time guards in the release-kit block
        # would refuse every trunk checkout they sweep.
        env:
          SKIP: no-commit-to-branch,rk-worktree-location
        run: nix develop --command just dev='' lint

  # Push-stage gate: the integration tests, the release build, the package
  # build and verification, and the dependency, history, and networked checks
  # — whatever `.pre-commit-config.yaml` runs at the pre-push stage.
  lint-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-push-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Push-stage gate
        env:
          SKIP: no-commit-to-branch,rk-worktree-location
        run: nix develop --command just dev='' lint-push

  # The release targets, as dist plans them. `dist plan` reads
  # dist-workspace.toml and emits the build matrix that the tag's `release.yml`
  # builds from, so `dist-build` below builds exactly what a release builds.
  # The `dist-generate-check` hook of the push stage already holds
  # `release.yml` equal to what the pin generates, so this job does not repeat
  # that proof.
  dist-plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: the configuration produces a viable release
        id: plan
        # The devshell greets on stderr, so the file holds the plan alone.
        run: |
          set -euo pipefail
          nix develop --command dist plan --output-format=json > plan-dist-manifest.json
          echo "plan=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

  # Every release target, built before a merge. A target that the code cannot
  # build fails the request here, instead of failing the release after
  # release-plz already pushed its tag. The macOS and Windows targets need
  # their own runners, and Nix runs on neither Windows nor every matrix
  # runner, so each job installs dist the way the generated `release.yml`
  # does and proves the pin of dist-workspace.toml.
  dist-build:
    needs: dist-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dist-plan.outputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: install Rust where the container has none
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: install dist
        run: ${{ matrix.install_dist.run }}
      - name: dist runs at the configured pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version"; exit 1; }
          dist --version | grep -Fq "$pin"
      - name: install the system packages the target needs
        run: |
          ${{ matrix.packages_install }}
      - name: build the matrix target
        env:
          DIST_ARGS: ${{ matrix.dist_args }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dist build $DIST_ARGS

  # The one check the trunk's protection requires. `rk setup step protect-trunk`
  # takes exactly one project check name beside `pr-title`, so a workflow with
  # several jobs needs one job that stands for all of them. Without it only the
  # named job blocks a merge, and an armed release request merges over a red
  # sibling — which is how a release once shipped with `lint` failing.
  #
  # `always()` is what makes this a gate rather than a mirror: a needed job that
  # fails or is cancelled skips a plain dependant, and a skipped required check
  # never turns the merge button green, so the request hangs with nothing said.
  # Running always and asserting each result reports a real failure instead.
  gate:
    if: always()
    needs: [lint, lint-push, dist-plan, dist-build]
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job reported $r"; exit 1; }
          done
