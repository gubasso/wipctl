# Settings of the lychee link check, which the lychee-system hook runs at the
# push stage over every tracked Markdown file.

# Keep the results in .lycheecache, which git ignores, so a second push within
# a day reads no link twice.
cache = true
max_cache_age = "1d"

# The release tool generated CHANGELOG.md, and its first two release links name
# the tag v0.1.0, which the forge does not hold. The changelog follows its
# generator, so the check accepts those two links here.
exclude = [
  '^https://github\.com/gubasso/wipctl/compare/v0\.1\.0\.\.\.v0\.1\.1$',
  '^https://github\.com/gubasso/wipctl/releases/tag/v0\.1\.0$',
]
