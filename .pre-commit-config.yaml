      - id: ki-state
        name: 'known issue state'
        entry: sdd gate ki-state
        language: system
        always_run: true
        pass_filenames: false
      - id: no-personal-path
        name: 'no personal path'
        entry: sdd gate no-personal-path
        language: system
        types: [text]
      - id: no-self-narration
        name: 'documents state the present'
        entry: sdd gate no-self-narration
        language: system
        files: '^docs/(?:specs|decisions|guides|reference|explanation)/(?:.*/)?[^/]*\.md$'
        types: [markdown]
        exclude: '^docs/decisions/.*$'
      - id: prose-stays-unwrapped
        name: 'prose lines stay unwrapped'
        entry: sdd gate prose-stays-unwrapped
        language: system
        files: '^docs/(?:specs|decisions|guides|reference|explanation)/(?:.*/)?[^/]*\.md$'
        types: [markdown]
        exclude: '^(?:.*/)?CHANGELOG\.md$'
      - id: spec-requirement-parts
        name: 'spec requirement parts'
        entry: sdd gate spec-requirement-parts
        language: system
        files: '^docs/specs/SPEC-[^/]*\.md$'
      - id: spec-rule-id-unique
        name: 'spec rule IDs are unique'
        entry: sdd gate spec-rule-id-unique
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-size-cap
        name: 'spec size cap'
        entry: sdd gate spec-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-trailing-section
        name: 'spec trailing section'
        entry: sdd gate spec-trailing-section
        language: system
        files: '^docs/specs/SPEC-[^/]*\.md$'
      - id: spec-verify-hooks-exist
        name: 'spec hook references exist'
        entry: sdd gate spec-verify-hooks-exist
        language: system
        always_run: true
        pass_filenames: false
      - id: suppression-names-its-case
        name: 'suppressions name a known issue'
        entry: sdd gate suppression-names-its-case
        language: system
        always_run: true
        pass_filenames: false
      - id: tracking-registry
        name: 'tracking registry is valid and current'
        entry: sdd gate tracking-registry
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links@5.1.3']
# END spec-driven-docs managed
