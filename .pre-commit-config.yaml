# All three hook types are installed. The commit stage and the push stage
# together run every check CI runs, and CI runs those two stages and nothing
# beside them (quality-gates:the-local-stages-hold-every-ci-check).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The node hook runs on the devShell nodejs. Without this line an empty
# pre-commit cache can pick `default`, and nodeenv then fails on a prerelease
# entry of the node index: "invalid literal for int() with base 10: '0-alpha'"
# (2026-11-10).
default_language_version:
  node: system

# A hook that names no `stages` inherits this, so the cheap tree-wide checks
# (formatting, lints, editorconfig, spelling, markdown, secrets) run once, at
# the commit stage. The push stage holds only the costly checks, the tests,
# builds, and networked checks a hook names `pre-push` for, and repeats none of
# the commit stage. Without this line the default is every stage, which would
# also drag the checks into commit-msg, where they are handed the message file
# and match nothing. `committed` opts back into commit-msg explicitly.
default_stages: [pre-commit]

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at:
# pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# A CI sweep commits nothing, so a job running pre-commit against a trunk
# checkout sets SKIP=no-commit-to-branch,rk-worktree-location in its environment. Append the id of
# every check this project classifies local-only: the value is a list the
# project owns the tail of.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      - id: rk-worktree-location
        name: rk worktree location
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-push-to-trunk
        name: rk no push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" != refs/heads/master ] || { echo "the trunk takes no direct push; it is written through merged requests alone" >&2; exit 1; }'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|release-please-config\.json$|cliff\.toml$|\.release-please-manifest\.json$|VERSION$)'
# END release-kit
  # --- Housekeeping (auto-fix where possible) ---
  #
  # Deliberately left as a pre-commit-managed python env, not converted to
  # `language: system` like the tool hooks below. These are not distributed
  # tools with a devShell package behind them — they are ~12 small scripts
  # inside one python package, and converting them would mean writing 12 local
  # stanzas and hand-carrying each upstream `types`, `args` and
  # `pass_filenames`. That is 12 chances to silently drop a selector, bought
  # for nothing: the env is pure python, has no binary to link wrongly, and costs
  # about a second to build once.
  #
  # A generated file follows its generator, and no hook here rewrites or judges
  # it. Source: the dev-environment rule of nix-secrets
  # (home/apps/claude-session/rules/dev-environment.md). The generated files
  # and their generators:
  #   CHANGELOG.md                             release-plz
  #   SECURITY.md, .github/workflows/pr-title.yml,
  #   .github/workflows/release-plz.yml        rk, rendered whole
  #   .release-kit/manifest.json               rk
  #   .github/workflows/release.yml            cargo-dist
  #   Cargo.lock, flake.lock                   cargo, nix
  #   .spec-driven-docs/, docs/.markdownlint-cli2.jsonc
  #                                            sdd, which verifies them byte
  #                                            for byte
  # Each tool excludes them in its own configuration: dprint.json,
  # dprint.markdown.json, .markdownlint-cli2.jsonc, _typos.toml, and
  # .editorconfig-checker.json; taplo skips Cargo.lock by itself. The fixers,
  # no-emphasis, and the two link-form rules have no configuration, so each
  # takes its own exclude. The reading hooks keep them: the parsers and the
  # secret scans. The sdd gates run with `always_run` and read no filenames.
  #
  # Five of these ids set `stages: [pre-commit, pre-push, manual]` in their own
  # manifest, and a manifest `stages` wins over `default_stages`. Each of the
  # five names the commit stage here, so the push stage repeats none of them.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.release-kit/manifest\.json|\.github/workflows/(pr-title|release-plz|release)\.yml|docs/\.markdownlint-cli2\.jsonc)$|^\.spec-driven-docs/|(^|/)(Cargo|flake)\.lock$'
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.release-kit/manifest\.json|\.github/workflows/(pr-title|release-plz|release)\.yml|docs/\.markdownlint-cli2\.jsonc)$|^\.spec-driven-docs/|(^|/)(Cargo|flake)\.lock$'
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=16384']
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: detect-private-key
      # - id: no-commit-to-branch

  # Left managed: check-json5 is the one tool here with no nixpkgs package, so
  # the devShell has nothing to provide. It is a pure-python console script
  # over a single dependency (json5), with no binary to link wrongly, so the
  # managed venv is cheap and correct. Packaging it locally would be the only
  # way to convert this one, and it is not worth a derivation.
  - repo: https://github.com/maresb/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        exclude: '[-.]lock\.json$'

  # --- JSON / JSONC formatter: dprint (comment-safe autofix) ---
  #
  # dprint's json plugin formats JSON and JSONC (comments + trailing commas),
  # which the stdlib-based pretty-format-json cannot. check-json5 above stays the
  # syntax gate; dprint owns formatting. Config in the sibling `./dprint.json`
  # (plugin version pinned there). `language: system`, so dprint is supplied by
  # the project's flake devShell (`pkgs.dprint`), its one owner. pre-commit
  # only — git push may strip
  # PATH, and formatting is already applied by commit time.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint fmt (json/jsonc)
        # --allow-no-files: dprint exits 14 when every path it receives is one its
        # own configuration excludes, such as a commit of only a generated file.
        entry: dprint fmt --allow-no-files
        language: system
        files: '\.(json|jsonc|json5)$'
        pass_filenames: true
        stages: [pre-commit]

  # --- EditorConfig ---
  #
  # The upstream hook, `language: golang`: pre-commit builds it at the pinned
  # rev. Upstream's definition is `entry: editorconfig-checker` and nothing
  # else, so filenames are passed and file selection stays `types: [file]` by
  # omission. Everything below the id is ours.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        # This hook enforces only what no other formatter owns: charset, line
        # endings, and trailing whitespace. Each disabled check below is
        # disabled because a real formatter is already authoritative for it,
        # and two authorities on one property is a gate that fails on correct
        # output.
        #
        #   -disable-insert-final-newline: end-of-file-fixer owns it.
        #   -disable-indent-size: rustfmt, dprint, taplo, nixfmt and shfmt each
        #     own indentation for their own file type. The checker counts
        #     left-padding without understanding syntax, so it rejects
        #     rustfmt-stable output — a continued string literal aligned to its
        #     opening quote lands on a non-multiple-of-4 column and is flagged.
        #     indent_style (spaces vs tabs) is still checked, which no
        #     formatter contradicts.
        #   -disable-max-line-length: the only glob carrying a width is
        #     [*.rs] = 100, mirroring rustfmt's max_width. rustfmt treats that
        #     as a target, not a gate — it will not split a long string literal
        #     or a long comment — so enforcing it here would fail lines rustfmt
        #     deliberately left alone. The value stays in .editorconfig as the
        #     declaration editors and rustfmt read.
        args:
          - -disable-insert-final-newline
          - -disable-indent-size
          - -disable-max-line-length
          - '-exclude'
          - 'LICENSE'
        # Markdown is excluded: editorconfig-checker can't parse it — it flags
        # fenced-code-block interiors and the odd-width ordered-list
        # continuations CommonMark/dprint use (e.g. `1. ` -> 3 spaces), and
        # defaults to indent_size=4 even when unset. Markdown formatting is
        # owned by dprint + markdownlint-cli2 when those hooks are layered in.
        exclude: '\.md$'

  # --- Rust: format & lint (auto-fix) ---
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devShell pins.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-fix
        name: clippy auto-fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-strict
        name: clippy gate
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # owner: devshell (no-hook-language) upstream taplo publishes no pre-commit hook.
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- Tests (layered per the CLI testing pyramid) ---
  #
  # Uses cargo-nextest because it produces deterministic, token-efficient
  # output (suppresses stdout/stderr from passing tests by default) and
  # supports per-profile `default-filter` for clean test-kind layering.
  #
  # Test classification (CLI testing pyramid):
  #   - Unit:        `src/` inline `#[cfg(test)] mod tests`. One function
  #                  or module in isolation. kind(lib) for library crates;
  #                  kind(bin) when unit tests live inside a [[bin]] target
  #                  (binary-only crates with no [lib]).
  #   - Integration: `tests/*.rs`  (kind=test). Tests the *seam* between
  #                  components. The defining property is "tests the
  #                  interaction between things," NOT "touches real
  #                  things." A wrapper CLI exercising its argv contract
  #                  against a recording stub / faked child is integration.
  #   - E2E:         The whole product against real external systems
  #                  (real subprocess, real network, real container). E2E
  #                  belongs in CI ONLY — never pre-commit or pre-push:
  #                  too slow, too dependent on host state, too flaky to
  #                  gate local commits. Do NOT add an E2E hook here.
  #   - Doc tests:   `///` doctests in library items. NOT runnable by
  #                  nextest — covered by the separate `cargo test --doc`
  #                  hook below.
  #
  # Tier-to-hook mapping:
  #   - pre-commit: unit only            (sub-second budget)
  #   - pre-push:   integration          (single-digit-seconds budget)
  #   - CI:         the same two stages, and nothing beside them
  #
  # Each tier runs at one stage only, so the push stage repeats no unit test
  # (quality-gates:the-local-stages-hold-every-ci-check). CI runs both stages,
  # which is what catches a commit that skipped its hooks.
  #
  # `--no-tests=warn` is load-bearing on a young crate. Since nextest 0.9.85 the
  # default is `fail`: a run matching zero tests exits 4 (NO_TESTS_RUN), so a
  # freshly scaffolded crate — or a profile whose `default-filter` legitimately
  # selects nothing yet — could not commit at all. `warn` keeps the run green
  # while still printing the no-op, so an over-narrow filter stays visible
  # rather than silently passing forever (which `pass` would hide). There is no
  # `.config/nextest.toml` key for this: it is a CLI flag (or NEXTEST_NO_TESTS).
  #
  # Requires:
  #   - `cargo nextest` from the devShell (`flake.nix`)
  #   - the sibling `.config/nextest.toml` at the repo root, defining the
  #     `pre-commit` and `pre-push` profiles.
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest-unit
        name: cargo nextest (unit tests)
        entry: cargo nextest run --profile pre-commit --all-features --no-tests=warn
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]

      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest-integration
        name: cargo nextest (integration tests)
        entry: cargo nextest run --profile pre-push --all-features --no-tests=warn
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]

      # The release profile sets `lto`, `codegen-units`, and `strip`
      # (Cargo.toml), so a defect can break it and leave the debug build that
      # the tests use green. Pre-push, because it is a full optimized build.
      # owner: devshell (project-environment) cargo build builds the crate.
      - id: cargo-build-release
        name: cargo build (release profile)
        entry: cargo build --release --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]

      # The release automation verifies the package before it publishes: it
      # packages the crate and builds the packaged copy (release-plz.toml).
      # This runs the same check with the devShell `cargo`, so a file the
      # package drops, or a build that fails only from the packaged copy, fails
      # here and not at release time. It reads the registry index, so it is a
      # networked check and runs at pre-push.
      # owner: devshell (no-hook-language) a script of this repository that runs cargo.
      - id: publish-dry
        name: cargo publish --dry-run (the package builds)
        entry: scripts/publish-dry --allow-dirty
        language: system
        files: '^(Cargo\.(toml|lock)|src/.*|README\.md|CHANGELOG\.md|LICENSE-.*|scripts/publish-dry)$'
        pass_filenames: false
        stages: [pre-push]

      # Doctests need a library target, and `cargo test --doc` exits non-zero
      # with "no library targets found" on a bin-only crate — so this gate
      # cannot hold until `src/lib.rs` exists. nextest never runs doctests, so
      # nothing else covers them; re-enable this in the same change that adds
      # the lib target.
      # - id: cargo-doc-tests
      #   name: cargo test --doc (doctests)
      #   entry: cargo test --doc --all-features
      #   language: system
      #   types_or: [rust, toml]
      #   pass_filenames: false
      #   stages: [pre-push]

  # --- Spell check ---
  #
  # The upstream `language: python` hook. Its wheel holds a prebuilt binary that
  # links the standard ELF loader, which the host supplies (nix-ld on a NixOS
  # host). The `-src` ids stay unused: pre-commit builds them with
  # `cargo install --path .`, which fails on the virtual workspace manifest at
  # the upstream root (verified against crate-ci/typos at v1.49.0).
  #
  # typos is REPORT-ONLY here by construction. Upstream's default args are
  # [--write-changes, --force-exclude], and typos' auto-fix silently rewrites
  # deliberate identifiers and error strings. `args:` replaces them whole, so
  # no default arg is inherited. Fix real typos by hand; allowlist false
  # positives in ./_typos.toml. The manifest names more stages than the commit
  # stage, which win over default_stages, so `stages:` is explicit.
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        types: [text]
        # --force-exclude is carried in `args:` as the machine-visible form of
        # the invariant this hook depends on: that it never inherits upstream's
        # [--write-changes, --force-exclude] and therefore never auto-fixes.
        # --force-exclude keeps `exclude:` honoured for filenames pre-commit
        # passes explicitly.
        args: [--force-exclude]
        stages: [pre-commit]
  # --- Commit message length and punctuation (commit-msg stage) ---
  #
  # Narrowed on purpose. The Conventional Commits shape — the type and the
  # required scope — belongs to `conventional-pre-commit` inside the
  # release-kit block above, and the pull-request title check holds the same
  # shape. Neither one holds the scope to a fixed vocabulary: the scope is free
  # text, and AGENTS.md carries the guidance for choosing one. Two hooks must
  # not judge one property, so ./committed.toml sets `style = "none"` and keeps
  # only the 72-column caps and the trailing-period rule, which nothing in the
  # block checks.
  #
  # Policy lives in ./committed.toml, which committed discovers at the repo
  # root, so this stanza only wires the stage and the message file. The
  # upstream `language: python` hook, like typos above. `--commit-file` is
  # upstream's own arg and is what makes the hook read the message pre-commit
  # hands it rather than scanning history.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        # Upstream's own args, carried over verbatim. --commit-file makes the
        # tool read the message file pre-commit appends after these, rather
        # than scanning history; --fixup and --wip let those two commit shapes
        # through, since they are squashed before they land.
        args: [--fixup, --wip, --commit-file]
        stages: [commit-msg]
        always_run: true
        pass_filenames: true

  # --- A breaking change carries its adopter guidance (commit-msg stage) ---
  #
  # The third property of a commit message this repository judges, and the one
  # neither hook above reaches. `conventional-pre-commit` reads the subject's
  # shape and `committed` reads its width, so the body goes unjudged; the
  # release-kit block's own body check guards attribution and internal paths
  # and nothing else.
  #
  # AGENTS.md says a breaking change owes a changelog entry naming what breaks
  # and what an adopter does next. That entry is generated: `release-plz.toml`
  # renders `commit.breaking_description`, which is this message's
  # `BREAKING CHANGE:` footer. Guidance written anywhere else never reaches the
  # release, and the field then falls back to the subject, so the entry repeats
  # itself. The rule was stated in prose and gated by nothing, and two breaking
  # changes in a row missed it. This hook is the gate it was missing.
  #
  # `language: system`; the script calls bash and grep from the host. The script is repository tooling and is excluded from the published
  # package, which is why the case suite skips when it is absent.
  - repo: local
    hooks:
      # owner: host (no-hook-language) a script of this repository that calls only bash and grep.
      - id: breaking-change-carries-a-footer
        name: a breaking change carries its adopter guidance
        entry: scripts/check-breaking-footer
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true

  # --- Secret scanning (commit stage) ---
  #
  # The upstream `language: rust` hook: pre-commit builds it with rustup, which
  # downloads with the devShell curl. The system id served only because the
  # devShell carried the binary, which no longer holds. Upstream stays
  # authoritative for `args: [--strict-ignore]`, `types: [text]` and
  # `require_serial: true`.
  #
  # Upstream sets no `stages`, so this inherits `default_stages` and scans
  # what each commit adds. gitleaks below scans the history at the push stage.
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  #
  # The upstream `language: golang` hook, but the entry IS overridden, unlike
  # ripsecrets above, and the differences are deliberate:
  #
  #   - Upstream's entry is `gitleaks git --pre-commit --redact --staged
  #     --verbose`, which scans only what is staged. This hook runs at pre-push
  #     to scan history, which is the thing a staged scan cannot see: a secret
  #     committed earlier and about to be published. So `--pre-commit` and
  #     `--staged` are dropped on purpose; `--redact` and `--verbose` are
  #     upstream's and are carried over into `args:`.
  #   - `pass_filenames: false` is restated so the history scan never takes
  #     staged filenames as stray positional arguments to `gitleaks git`.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git
        args: [--redact, --verbose]
        pass_filenames: false
        stages: [pre-push]

  # --- Unused dependency detection ---
  #
  # The upstream `language: rust` hook, which pre-commit builds from source into
  # its own env. `types_or` is restated so the whole-tree dependency scan runs
  # only on a change to a manifest or the lock file.
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        types_or: [cargo, cargo-lock]
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo audit is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Note: licenses check omitted; requires deny.toml with an allow-list.
      # Add `licenses` to the check list after creating deny.toml in your project.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check advisories bans sources
        language: system
        pass_filenames: false
        stages: [pre-push]

  # --- Generated artifact workflow: drift gate (pre-push only) ---
  #
  # `.github/workflows/release.yml` is generated from `dist-workspace.toml` by
  # `dist generate`, never written by hand, and it is the file GitHub actually
  # executes at release time. Editing the configuration without regenerating
  # leaves the executable workflow stale while every other gate stays green, so
  # a setting like `github-attestations` or an action SHA pin silently does
  # nothing until a release needs it. Nothing else here can see that: the
  # release-kit block's `rk-status-check` judges the landing record, not
  # cargo-dist's output.
  #
  # `language: system`, so `dist` comes from the flake devShell like every
  # other tool hook. The devShell's `pkgs.cargo-dist` must stay equal to the
  # `cargo-dist-version` pin in `dist-workspace.toml`; a different version
  # generates a different workflow and this gate is what reports the mismatch.
  #
  # `--check` writes nothing and exits non-zero with the file it would change.
  # pre-push only: regenerating is a deliberate act, and the repair is one
  # `dist generate` away.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) cargo-dist publishes no pre-commit hook.
      - id: dist-generate-check
        name: dist generate --check (the release workflow matches its config)
        entry: dist generate --check
        language: system
        files: '^(dist-workspace\.toml|\.github/workflows/release\.yml)$'
        pass_filenames: false
        stages: [pre-push]
  # --- Nix: format (auto-fix) + lint (gate) ---
  #
  # Every project carries a per-project flake devShell, so these run against its
  # Nix sources. Tools come from that devShell (nix develop / direnv) and run as
  # system hooks off PATH, like dprint/cargo-fmt. nixfmt (RFC 166, the
  # nixpkgs-standard formatter) rewrites in place, and `nix fmt` runs the same
  # nixfmt as the flake's formatter; deadnix runs as its upstream hook below.
  # statix and deadnix are
  # report-only gates — fix by hand or allowlist. statix walks the tree itself,
  # so its scope/ignore lives in the sibling `./statix.toml`. `nix flake check`
  # evaluates the flake and builds its `checks` output, which is the package
  # of `nix/package.nix`. It runs at the pre-push stage, on a change to any
  # input of that build.
  - repo: local
    hooks:
      # owner: devshell (outside-caller) nix fmt runs the formatter of this flake, pkgs.nixfmt, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt (format)
        entry: nixfmt
        language: system
        types: [nix]
        stages: [pre-commit]
      # owner: devshell (no-hook-language) statix has no hook in a language that pre-commit builds.
      - id: statix
        name: statix (nix anti-patterns)
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
        stages: [pre-commit]
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that pre-commit builds.
      - id: nix-flake-check
        name: nix flake check (builds the package)
        entry: nix flake check
        language: system
        files: '(\.(nix|rs|toml|lock)$|^(scripts|tests)/)'
        pass_filenames: false
        stages: [pre-push]

  # --- Schemas: the draft, and the record they govern (local) ---
  #
  # docs/specs/SPEC-quality-gates.md requires that every shipped schema
  # validate against the draft 2020-12 metaschema, and that a machine format be
  # validated against its schema with real content. Neither claim can be made
  # in prose: a schema that is not itself valid gates nothing, and a valid
  # schema that says the wrong thing gates the wrong record.
  #
  # `pass_filenames: false` with a `files` selector: the script walks the
  # schema tree and the fixture itself and pairs each instance with the schema
  # its name and position select, so a later change that adds a governed file
  # is picked up without editing this hook. `files` decides when the gate runs;
  # the script decides what it reads.
  #
  # The commit stage alone, per
  # quality-gates:the-local-stages-hold-every-ci-check: CI runs the same stage,
  # so a commit made with the commit hooks skipped still meets the gate before
  # it merges.
  #
  # `language: system`; check-jsonschema comes from the devShell, which is the
  # single provider.
  # SATISFIES quality-gates:every-schema-validates-against-the-metaschema
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) a script of this repository that calls check-jsonschema, which the tests also run.
      - id: check-schemas
        name: schemas match the draft, and the fixture matches the schemas
        entry: scripts/check-schemas
        language: system
        files: '^(docs/specs/SPEC-[^/]+/.*\.schema\.json|tests/fixtures/.*|scripts/check-schemas)$'
        pass_filenames: false

  # --- Prose rules no linter can express (local; before the formatter) ---
  #
  # AGENTS.md bans inline bold and italics, and caps an ADR body at 350 words.
  # Neither is expressible in the tools already wired here: dprint's
  # `emphasisKind`/`strongKind` only choose which delimiter is used, and
  # markdownlint's MD036 fires only on a whole emphasized paragraph, so a bold
  # lead-in followed by prose passes it. Hence two project-local scripts.
  #
  # These run BEFORE dprint deliberately: the emphasis check is fence-aware and
  # reads the file as the author wrote it, so it should report on the author's
  # own line numbers rather than on a reflowed paragraph.
  #
  # `language: system`; bash and awk are host tools, and each hook names its
  # owner below. The escape hatch is `<!-- allow-emphasis: <reason> -->` on the
  # preceding line, which makes an exception a recorded decision.
  - repo: local
    hooks:
      # owner: host (no-hook-language) a script of this repository that calls only awk.
      - id: no-emphasis
        name: no bold or italics (docs-format:document-uses-structural-markdown-only)
        entry: scripts/check-emphasis
        language: system
        files: '\.(md|markdown)$'
        # A vendored tree another tool installs and verifies byte for byte is
        # that tool's text, not this repository's prose, so the rule stops at
        # its boundary. Editing inside it is what `sdd verify` refuses. The
        # generated CHANGELOG.md and SECURITY.md follow their generator.
        exclude: '^\.spec-driven-docs/|^(CHANGELOG|SECURITY)\.md$'
        pass_filenames: true

      # The delivered chapter gate selects numbered chapters, catalogs, and
      # README files. This repository names its chapters for their subject, so
      # that selector reaches none of them. This hook holds the same budget over
      # the two zones whose documents are chapters.
      # owner: host (no-hook-language) a script of this repository that calls only the shell.
      - id: chapter-line-cap
        name: chapter line cap (docs-format:chapter-stays-within-200-lines)
        entry: scripts/check-chapter-lines
        language: system
        files: '^docs/(explanation|guides)/.*\.(md|markdown)$'
        pass_filenames: true

      # `docs/specs/` owns every binding rule. A sentence carrying an uppercase
      # requirement keyword anywhere else binds a reader while carrying no rule
      # id, no scenario, and no verification, so it reads as gated and is not.
      #
      # The selector is anchored to the documentation root
      # `.spec-driven-docs/manifest.json` states, not to the tree. Both failures
      # this gate was written after came from a tree-wide pattern: it caught the
      # one line of the rendered release block in AGENTS.md that carries MUST.
      # The spec zone is excluded because it is the zone the keywords belong to.
      # owner: host (no-hook-language) a script of this repository that calls only awk.
      - id: requirement-keyword-zone
        name: requirement keywords stay in the spec zone (repository-docs:requirement-keyword-stays-in-the-spec-zone)
        entry: scripts/check-requirement-keywords
        language: system
        files: '^docs/.*\.(md|markdown)$'
        exclude: '^docs/specs/'
        pass_filenames: true

  # --- Markdown: canonical format (dprint) + style gate (markdownlint) ---
  #
  # Universal overlay: every project carries docs/READMEs, so its markdown is
  # formatted and linted everywhere — the same model as the shared Nix overlay.
  # dprint owns canonical formatting; `markdown.textWrap: "never"` (in the sibling
  # ./dprint.markdown.json) unwraps every soft-wrapped paragraph to one continuous
  # physical line for small diffs and predictable LLM tokens. Explicit hard breaks
  # (two trailing spaces / trailing `\`) are preserved, fenced code blocks are left
  # unreflowed, and tables stay intact. markdownlint-cli2 gates style beyond what
  # dprint enforces and autofixes the one thing dprint can't — ordered-list
  # renumbering (MD029); rules live in the sibling ./.markdownlint-cli2.jsonc.
  #
  # A dedicated ./dprint.markdown.json + `--config` keeps this invocation
  # independent of the type's own JSON dprint.json, and the `dprint-markdown` id
  # never collides with the type's `dprint` hook.
  #
  # `language: system`, so dprint is supplied by the project's flake devShell
  # (`pkgs.dprint`), its one owner, the same model as the json hook.
  # pre-commit only — git push may strip PATH and the format is already
  # applied by commit time.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint-markdown
        name: dprint fmt (markdown)
        # --allow-no-files, for the same reason as the JSON hook above.
        entry: dprint fmt --config dprint.markdown.json --allow-no-files
        language: system
        files: '\.(md|markdown)$'
        # AGENTS.md carries two tools' marked blocks, each verified byte for
        # byte. A formatter rewriting inside one is tampering, so this file is
        # formatted by hand.
        exclude: '^AGENTS\.md$'
        pass_filenames: true
        stages: [pre-commit]

  # --- Explicit relative links (ambiguity guard; pre-commit, local) ---
  #
  # A bare-filename relative link like [x](runbook.md) is ambiguous: the same
  # basename can exist in many directories, so neither humans nor tools can tell
  # which file is meant, and the link silently rots when a file moves. Require an
  # explicit prefix: ./name, ../dir/name, or a multi-segment path dir/name.
  # Fragment-only (#...), root-absolute (/...), and URL links pass. pygrep is
  # built into pre-commit — no external dependency, no companion file.
  - repo: local
    hooks:
      - id: no-bare-relative-links
        name: inline markdown links must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '\]\((?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/)[^)/\s:]+\.[A-Za-z0-9]+(?:#[^)]*)?\)'
        exclude: '^(CHANGELOG|SECURITY)\.md$'
      - id: no-bare-relative-link-defs
        name: markdown link definitions must be explicit (./, ../, or a path)
        language: pygrep
        types: [markdown]
        entry: '^\s*\[[^\]]+\]:\s+(?!https?://|ftp://|mailto:|tel:|/|#|\.\.?/|<)[^\s/:#]+\.[A-Za-z0-9]+'
        exclude: '^(CHANGELOG|SECURITY)\.md$'

  # --- Markdown lint (style gate + ordered-list renumber autofix) ---
  #
  # markdownlint-cli2 runs AFTER dprint. dprint owns all formatting; markdownlint
  # flags issues dprint can't normalize (heading hierarchy, link integrity) AND
  # autofixes ordered-list renumbering (MD029). The custom `relative-links` rule
  # (report-only) verifies an explicit relative target actually resolves on disk,
  # complementing the pygrep FORM guards above (form vs. existence). Configure via
  # the sibling ./.markdownlint-cli2.jsonc. Uses the node variant.
  #
  # `additional_dependencies` rules out `language: system` (there would be no env
  # to install the rule into), so this hook uses pre-commit's own node env. Add
  # `language_version: system` when the project's node comes from a nix profile,
  # mise, asdf or nvm — all under $HOME, which `lang_base.exe_exists` rejects, so
  # pre-commit silently falls back to downloading a generic-glibc node (~150 MB
  # per env, and one that cannot exec at all on a Nix host). Leave it unset when
  # the project may have no node installed: `system` has nothing to point at
  # then, while the downloaded runtime works.
  #
  # Both markdownlint entries therefore stay pre-commit-managed even though
  # nixpkgs does package markdownlint-cli2. The blocker is not the linter, it
  # is the custom rule: `markdownlint-rule-relative-links` is an npm package
  # with no nixpkgs derivation, and `additional_dependencies` is the only
  # mechanism that installs it. A `language: system` hook has no env to install
  # it into, so converting would silently drop the relative-links rule — the
  # on-disk existence check that the pygrep form guards above are paired with.
  # `language_version: system` already makes the node itself come from the
  # devShell, which is most of the benefit.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links']
        # Load-bearing here: this project's node comes from the flake devShell
        # (`pkgs.nodejs`). Without this line pre-commit probes for node via
        # `lang_base.exe_exists`, which rejects any interpreter under $HOME —
        # true for a user nix profile, mise, asdf or nvm — falls back to
        # `default`, and downloads a generic-glibc node that cannot exec on a
        # Nix host. `system` uses the node already on PATH.
        language_version: system

  # --- ADR heading shape (MD043; docs/decisions only) ---
  #
  # AGENTS.md fixes the shape of a decision record: the five sections of
  # docs/decisions/template.md, and exactly one `Status`. MD043 is the check
  # that holds it, and it is the one AGENTS.md doc rule a linter can enforce
  # outright — the array is a complete ordered list, so a missing section, an
  # extra one, a reordering, and a second `## Status` all fail by name.
  #
  # The wiring is forced by three facts about MD043: it is inert without a
  # `headings` array; markdownlint scopes config by directory only, with no
  # per-glob rule configuration; and `--config` sets a base that the discovered
  # project config merges OVER. So the array lives in its own shape config and
  # this entry chooses the files it applies to. The project
  # ./.markdownlint-cli2.jsonc deliberately never names MD043 — an explicit
  # `false` there would silently undo this while the hook still reported
  # success. `alias` keeps this distinct from the tree-wide hook above.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        alias: md-adr
        name: markdownlint (decision record heading shape)
        files: '^docs/decisions/ADR-[a-z].*\.md$'
        args: ['--config', '.markdownlint/adr.markdownlint-cli2.jsonc']
        additional_dependencies: ['markdownlint-rule-relative-links']
        language_version: system

  # --- Shell: lint + format ---
  #
  # The repository ships shell (scripts/, and the installer payload), and every
  # shipped artifact owes a commit-gate hook (docs/specs/SPEC-quality-gates.md),
  # so the gate is wired before the payload grows rather than after.
  #
  # Both take their upstream hooks, `language: python`, whose wheels carry
  # static binaries: shellcheck-py and scop/pre-commit-shfmt.
  #
  # shfmt runs with upstream's own args, `[--write]`, and nothing more,
  # deliberately. shfmt reads .editorconfig natively, but ONLY while no parser
  # or printer flag is given — pass even one and it silently ignores every
  # EditorConfig file and reverts to its own defaults, the first of which is
  # tabs. So the formatting options live in .editorconfig (indent_style,
  # indent_size, switch_case_indent, shell_variant). `-s` (simplify) has no
  # EditorConfig property and stays dropped. The manifest names pre-push as
  # well, which wins over default_stages, so `stages:` is explicit.
  # deadnix publishes a rust hook, which pre-commit builds; its manifest
  # carries --fail and the nix file type.
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix
        stages: [pre-commit]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        types: [shell]
        stages: [pre-commit]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]
        require_serial: true
        stages: [pre-commit]
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devShell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store. The hook is published by exobrain-tech.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.0.0
    hooks:
      - id: no-path-flake-reference
# BEGIN spec-driven-docs managed
  - repo: local
    hooks:
      - id: spec-driven-docs-verify
        name: verify spec-driven docs instance
        entry: sdd verify
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-cites-a-live-rule
        name: 'decision record citations resolve'
        entry: sdd gate adr-cites-a-live-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-filename-shape
        name: 'decision record filename shape'
        entry: sdd gate adr-filename-shape
        language: system
        files: '^docs/decisions/[^/]*\.md$'
      - id: adr-word-cap
        name: 'decision record word cap'
        entry: sdd gate adr-word-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: agents-digest-size
        name: 'agent digest size'
