[workspace]
changelog_update = true
# The bot's own release request has a release-plz-* head branch, which is
# exactly what the branch heuristic behind this default recognizes: the
# release half fires only on the push that lands that request's bump, so an
# ordinary work merge publishes nothing and the release decision stays on the
# one merge button.
release_always = false
publish = true
# cargo-dist owns the GitHub release, because it is the half that has the
# installers to attach. release-plz creating it first leaves dist's host job
# failing on "a release with the same tag name already exists" and every
# release carrying no binaries. The tag stays release-plz's; git_tag_enable is
# separate and still on.
git_release_enable = false
# wipctl is a binary-only crate: src/main.rs and no lib target, so no
# external consumer holds an API for a bump to break. Set true in the same
# change that adds a lib target other crates depend on.
semver_check = false

# The changelog is a generated artifact, and this repository's own prose gates
# judge it like any other markdown: AGENTS.md bans bold and italics, and dprint
# unwraps every soft-wrapped paragraph to one physical line. release-plz's
# default template emits neither shape — it writes `*(scope)*` and
# `[**breaking**]`, and wraps its header across two lines — so every generated
# changelog would fail `lint` on the bot's own release request.
#
# The fix belongs here rather than in the gates: change the configuration and
# regenerate, never edit the generated file, and never widen a gate to admit a
# tool's default. The template below states the same facts without emphasis.
# The scope is an identifier, so it takes inline code, which is what AGENTS.md
# asks for; a breaking change says so in words.
#
# The whitespace control is load-bearing. Tera emits a newline for the tag
# line itself, so a plain `{% for %}` after the version heading writes a
# second blank line, and dprint collapses it. `{%- for` trims that newline,
# and the blank line after the group heading is written literally. Verified
# by generating an entry and confirming dprint leaves it byte-identical.
[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/), and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}]{% if release_link %}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}- {% if commit.breaking %}breaking, {% endif %}{% if commit.scope %}`{{ commit.scope }}`: {% endif %}{{ commit.message | upper_first }}
{% endfor %}{% endfor %}"""
trim = true
