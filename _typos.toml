# typos allowlist. Add an entry only when typos' suggestion is wrong or
# ambiguous — a term of art, a deliberate identifier, a non-English word. Real
# typos are fixed in the source, not silenced here.
#
# This project's docs carry method vocabulary (lanes, epics, capture, drain,
# WIP) that typos does not flag today; keep the list empty until it does.

[default.extend-words]
# `Nd` is the rendering placeholder for a count of days in a lane label
# (`id  title  <bar>  Nd`), not a misspelling of `And`.
Nd = "Nd"

# The files that a tool generates follow their generator, and typos judges none
# of them (source: the dev-environment rule of nix-secrets,
# home/apps/claude-session/rules/dev-environment.md): release-plz writes
# CHANGELOG.md, rk writes SECURITY.md, the landing record, and two workflows,
# cargo-dist writes release.yml, sdd installs .spec-driven-docs/ and
# docs/.markdownlint-cli2.jsonc, and cargo and nix write the lock files. The
# hook passes --force-exclude, so this list also holds for the files that
# pre-commit hands it.
[files]
extend-exclude = [
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/.release-kit/manifest.json",
  "/.github/workflows/pr-title.yml",
  "/.github/workflows/release-plz.yml",
  "/.github/workflows/release.yml",
  "/.spec-driven-docs/",
  "/docs/.markdownlint-cli2.jsonc",
  "Cargo.lock",
  "flake.lock",
]
